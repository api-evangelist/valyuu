apis:
- name: Valyuu Partner API
  description: Partner-facing trade-in API behind Valyuu's embedded recommerce platform.
    Version 1 exposes device catalog lookups (categories, brands, series, models, and
    model condition/attribute questions), FAQ content, trade-in order creation and
    cancellation, item offer confirmation (accept, decline-recycle, decline-return),
    shipping labels, and paperless shipping codes, authenticated with an X-Api-Key
    header. Documented via a Swagger endpoint referenced by Valyuu's public frontend
    demo repository; the documented staging base URL was unreachable (HTTP 522) when
    probed on 2026-07-21.
  image: https://kinlane-productions2.s3.us-east-1.amazonaws.com/apis-json-icon.png
  humanURL: https://github.com/Valyuu/partner-api-frontend-demo
  baseURL: https://api-staging.valyuu.tech/partner
