name: Valyuu
description: Valyuu is an Amsterdam-founded embedded recommerce service provider offering
  a plug-and-play trade-in platform that businesses integrate to buy back, resell,
  and recycle used consumer electronics such as smartphones, tablets, and smartwatches
  across Dutch, German, and English-language markets. Its partner-facing Trade-In API
  powers embedded trade-in flows covering device catalogs, condition questions, offers,
  payments, and shipping. Valyuu is a Techstars portfolio company; as of mid-2026
  valyuu.com redirects to prioont.com, whose storefront is currently unreachable.
